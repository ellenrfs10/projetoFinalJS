<!DOCTYPE html>
<html lang="PT-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Mulheres</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <header>
        <nav id="gps-header" class="titulo-header">
            <span class="icone-sos-blue">
                <img src="iconesos.jpg" alt="icone-SOS">
            </span>
            <h1>SOS Mulher</h1>
            <span class="badge-green"></span>
            <p class="gps-letter">GPS Ativo (Raio 10km)</p>
            <button type="button" class="capsula"> x Saída Rápida</button>
        </nav>

    </header>

    <main>
        <section id="abas-ajuda-ajudar">
            <span class="capsula-grande">
            <button id="pedir-ajuda" class="pedir-ajuda"> Quero Pedir Ajuda</button>
            <button id="quero-ajudar" class="quero-ajuda"> Quero dar ajuda</button>
            </span>
            <button class="rede-protetora">
                <h2 class="rede-protetora-titulo"> Rede Protetora Conectada</h2>
                <p> Há 42 protetoras & voluntárias ativas no seu raio</p>
            </button>

            <section class="pedido-sos">
                <button id="botao-sos" class="pedido-sos">
                    <link rel="stylesheet"  type="image/jpg" href="iconesos.jpg">
                    
                </button>
                <p>O teu pedido será enviado instantaneamente para protetoras e voluntárias num raio de 10 km</p>
                
            </section>

            <section>
                <h2 class="titulo-2"> Recursos Rápidos de Segurança</h2>
                <button class="button-ligar"> Ligar 112</button>
                <button class="button-gravar-audio"> Gravar Audio</button>
                <button class="partilhar-rota"> Partilhar Rota</button>

                <h2> Guia de Estado de Botão</h2>
                <p>Teste manualmente cada fase da experiência </p>
                <span class="cpasula-default"></span>
                <button id="cpasula-default">1 - Default</button>
                <span class="cpasula-localizacao">2 - Gravar Audio</span>
                <button id="cpasula-default">3 - localizacao</button>
                <button id="cpasula-default">4 - Ativar som SOS do Botão</button>
            </section>

            <footer id="footer" class="capsula-grande">
                 
                <button id="pedir-ajuda" class="pedir-ajuda"> Quero Pedir Ajuda</button>
                <button id="quero-ajudar" class="quero-ajuda"> Quero dar ajuda</button>
                    

            </footer>



        </section>




    </main>
    
</body>
</html>
